<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>さくらや 問い合わせ手帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="問い合わせ手帳">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#FFFFFF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
img{max-width:100%}
</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
:root{
  --bg:#EEF1F5; --surface:#FFFFFF; --surface2:#F6F8FB; --ink:#1B2436; --muted:#5B6679; --line:#D9DFE8;
  --chip:#E6EAF1; --chip-ink:#26314A; --accent:#B23049; --accent-soft:#F6E3E7; --accent-ink:#FFFFFF;
  --ok:#2C7A57; --warn:#A8671A; --warn-soft:#FBEFD9; --shadow:0 1px 2px rgba(20,30,50,.06),0 4px 14px rgba(20,30,50,.06);
  --r:12px;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic UI","Meiryo",sans-serif;
  --f-disp:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#10151E; --surface:#182031; --surface2:#1D2638; --ink:#E7ECF4; --muted:#9BA7BB; --line:#2B3549;
    --chip:#243048; --chip-ink:#DCE3EE; --accent:#E2687D; --accent-soft:#3A2230; --accent-ink:#1A0C12;
    --ok:#62C497; --warn:#E3A857; --warn-soft:#3A2E1A; --shadow:none;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#10151E; --surface:#182031; --surface2:#1D2638; --ink:#E7ECF4; --muted:#9BA7BB; --line:#2B3549;
  --chip:#243048; --chip-ink:#DCE3EE; --accent:#E2687D; --accent-soft:#3A2230; --accent-ink:#1A0C12;
  --ok:#62C497; --warn:#E3A857; --warn-soft:#3A2E1A; --shadow:none;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
.field .switch input{width:22px;height:22px;padding:0;flex:none}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-disp);margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:8px;margin-right:auto}
.brand h1{font-size:19px;font-weight:900;letter-spacing:.02em}
.brand span{font-size:12px;color:var(--muted)}
.fy{display:flex;align-items:center;gap:4px;background:var(--chip);border-radius:999px;padding:3px}
.fy button{border:0;background:transparent;width:36px;height:36px;border-radius:999px;font-size:16px}
.fy button:hover{background:var(--surface)}
.fy b{font-size:14px;padding:0 4px;min-width:6.5em;text-align:center}
.fy small{display:block;font-size:10px;color:var(--muted);font-weight:400;line-height:1}
.memo-btn{border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;height:42px;padding:0 18px;font-weight:700;display:flex;align-items:center;gap:8px}
.memo-btn .cnt{background:var(--surface);color:var(--accent);border-radius:999px;font-size:12px;min-width:22px;height:22px;display:grid;place-items:center;padding:0 6px}

/* layout */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;padding:16px;max-width:1280px;margin:0 auto}
@media (max-width:860px){.app{grid-template-columns:1fr;gap:12px;padding:12px 16px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.label{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:700}

/* picker */
.picker{padding:14px;display:flex;flex-direction:column;gap:10px;align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:860px){.picker{position:static}}
.picker-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
.picker-head .cur{display:none;font-weight:700}
.toggle-list{display:none;border:1px solid var(--line);background:var(--surface2);border-radius:999px;height:36px;padding:0 14px;font-size:13px}
@media (max-width:860px){
  .picker.collapsed .picker-body{display:none}
  .picker.collapsed .picker-head .cur{display:block}
  .toggle-list{display:block}
}
.picker-body{display:flex;flex-direction:column;gap:10px}
.search{width:100%;height:46px;border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:0 14px;font-size:16px}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;height:38px;font-size:14px;color:var(--chip-ink)}
.seg button[aria-pressed="true"]{background:var(--surface);font-weight:700;box-shadow:var(--shadow)}
.school-list{display:grid;grid-template-columns:1fr;gap:6px}
@media (max-width:860px){.school-list{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
@media (min-width:861px){.school-list{max-height:calc(100vh - 360px);min-height:240px;overflow-y:auto;padding-right:2px}}
.area-chips{gap:6px}
.area-chips .chip{min-height:38px;padding:0 12px;font-size:14px}
.area-chips .chip small{font-size:11px;opacity:.65}
.grp{grid-column:1/-1;font-size:12px;font-weight:700;color:var(--muted);padding:6px 2px 0;display:flex;justify-content:space-between}
.school{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:56px;padding:8px 12px;text-align:left;display:flex;align-items:center;gap:10px}
.school:hover{border-color:var(--muted)}
.school[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.school .t{font-size:11px;border-radius:6px;padding:1px 6px;background:var(--chip);color:var(--chip-ink);flex:none}
.school .n{font-weight:700;line-height:1.3}
.school .s{font-size:12px;color:var(--muted);display:block;font-weight:400}
.school .dots{margin-left:auto;display:flex;gap:3px;flex:none}
.dot{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18);flex:none}
.empty-note{font-size:13px;color:var(--muted);padding:6px 2px}

/* detail */
.detail{display:flex;flex-direction:column;gap:12px;min-width:0}
.school-card{padding:16px;display:flex;flex-direction:column;gap:14px}
.sc-head{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.sc-head h2{font-size:24px;font-weight:900;line-height:1.2}
.sc-head .meta{color:var(--muted);font-size:13px}
.grades{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
@media (max-width:520px){.grades{grid-template-columns:repeat(2,minmax(0,1fr))}}
.grade{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:10px;background:var(--surface2)}
.grade .sw{width:30px;height:30px;border-radius:8px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.grade b{display:block;font-size:15px;line-height:1.25}
.grade small{display:block;color:var(--muted);font-size:11px;line-height:1.3}
.grade.next{border-style:dashed}
.cycle-note{font-size:13px;color:var(--muted);margin:0}
.cycle-note strong{color:var(--ink)}
.notes{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.notes li{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.tag{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:2px 7px;margin-top:2px;background:var(--chip);color:var(--chip-ink);white-space:nowrap}
.tag.t-must{background:var(--accent-soft);color:var(--accent)}
.tag.t-change{background:var(--warn-soft);color:var(--warn)}

/* chips */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 16px;display:inline-flex;align-items:center;gap:7px;font-size:15px;color:var(--ink)}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip .req{font-size:10px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 4px}
.chip[disabled]{opacity:.4;cursor:default}
.chip.sm{min-height:40px;padding:0 13px;font-size:14px}

.filters{padding:14px 16px;display:grid;gap:12px}
.frow{display:grid;grid-template-columns:64px minmax(0,1fr);gap:10px;align-items:start}
.frow>.label{padding-top:13px}
@media (max-width:520px){.frow{grid-template-columns:1fr;gap:6px}.frow>.label{padding-top:0}}
.frow .seg{max-width:320px}
.fbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:700;height:40px;padding:0 6px}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:14px;min-height:40px}
.switch input{width:20px;height:20px;accent-color:var(--accent)}

/* results */
.results{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.rhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.rhead .big{font-family:var(--f-disp);font-size:30px;font-weight:900;line-height:1}
.rhead .sub{color:var(--muted);font-size:13px}
.sample{margin-left:auto;font-size:11px;font-weight:700;border:1px dashed var(--warn);color:var(--warn);border-radius:6px;padding:2px 8px}
.summary{font-size:14px;background:var(--surface2);border-radius:10px;padding:8px 12px}
.rlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;background:var(--surface)}
.item .cond{grid-row:span 2;width:40px;height:40px;border-radius:9px;display:grid;place-items:center;font-family:var(--f-disp);font-weight:900;font-size:20px}
.cond-A{background:#DDF1E6;color:#1E6B47}
.cond-B{background:#E3EAF7;color:#2C4E8C}
.cond-C{background:#F1ECE2;color:#7A5B25}
:root[data-theme="dark"] .cond-A{background:#1D3A2D;color:#8EE0B5}
:root[data-theme="dark"] .cond-B{background:#22304A;color:#A9C3F1}
:root[data-theme="dark"] .cond-C{background:#3A3122;color:#E6C68E}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .cond-A{background:#1D3A2D;color:#8EE0B5}
  :root:not([data-theme="light"]) .cond-B{background:#22304A;color:#A9C3F1}
  :root:not([data-theme="light"]) .cond-C{background:#3A3122;color:#E6C68E}
}
.item .nm{font-weight:700;line-height:1.3;min-width:0}
.item .sz{font-size:18px;font-weight:700}
.item .pr{font-weight:700;text-align:right}
.item .info{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.item .shelf{grid-column:3;text-align:right;font-size:12px;color:var(--muted)}
.old{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-soft);border-radius:4px;padding:0 5px}
.relax{display:grid;gap:6px}
.relax p{margin:0;font-size:14px}

/* memo sheet */
.scrim{position:fixed;inset:0;background:rgba(10,15,25,.45);z-index:40}
.sheet{position:fixed;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--surface);z-index:41;display:flex;flex-direction:column;
  padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 14px);gap:12px;overflow-y:auto;border-left:1px solid var(--line)}
.sheet-head{display:flex;align-items:center;justify-content:space-between}
.sheet-head h2{font-size:18px}
.x{border:0;background:var(--chip);width:40px;height:40px;border-radius:999px;font-size:18px}
.field{display:grid;gap:4px}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:16px;width:100%}
.field textarea{min-height:84px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:46px;padding:0 16px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);flex:1}
.logs{display:grid;gap:8px}
.log{border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;display:grid;gap:4px;background:var(--surface2)}
.log .lh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.log .lh b{font-size:14px}
.log .del{margin-left:auto;border:0;background:transparent;color:var(--muted);font-size:12px;height:30px}
.cb{font-size:11px;font-weight:700;background:var(--accent);color:var(--accent-ink);border-radius:4px;padding:1px 6px}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);background:var(--ink);color:var(--surface);padding:10px 18px;border-radius:999px;font-size:14px;z-index:60}
@media (prefers-reduced-motion:no-preference){.chip,.school,.seg button{transition:background .12s,border-color .12s,color .12s}}
.kind-chips{gap:6px}
.kind-chips .chip{min-height:38px;padding:0 12px;font-size:14px}
.kind-chips .chip small{font-size:11px;opacity:.65}
.wardrobe{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:640px){.wardrobe{grid-template-columns:1fr}}
.wcol{border:1px solid var(--line);border-radius:10px;background:var(--surface2);padding:10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.wcol h3{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
.wcol .none{font-size:13px;color:var(--muted)}
.gmark{width:10px;height:10px;border-radius:3px;flex:none}
.g-m{background:#2F5FA8}.g-f{background:#C8374A}.g-u{background:#7A8699}
.witem{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;text-align:left;display:grid;gap:1px;min-height:44px}
.witem:hover{border-color:var(--muted)}
.witem[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.witem b{font-size:14px;line-height:1.35}
.witem small{font-size:12px;color:var(--muted);line-height:1.35}
.inq{padding:14px 16px;display:grid;gap:12px}
.inq-sum{font-family:var(--f-disp);font-size:20px;font-weight:700;line-height:1.45;background:var(--surface2);border-radius:10px;padding:12px 14px;border:1px solid var(--line)}
.inq-sum .ph{color:var(--muted);font-weight:400;font-family:var(--f-body);font-size:15px}
.inq-sum small{display:block;font-family:var(--f-body);font-size:13px;font-weight:400;color:var(--muted)}
.cta{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.cta .btn.primary{flex:0 1 auto;padding:0 22px}
.stock-note{font-size:12px;color:var(--warn);border:1px dashed var(--warn);border-radius:6px;padding:2px 8px}
.sizefree{height:40px;border:1px solid var(--line);border-radius:999px;background:var(--surface2);padding:0 14px;font-size:15px;width:9.5em}
.size-chip{gap:8px}
.size-chip small{font-size:11px;opacity:.75;margin-left:4px}
.sdot{width:18px;height:18px;border-radius:50%;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.sdot.none{background:transparent;border:1.5px dashed var(--muted);box-shadow:none}
.chart-name{font-size:10px;letter-spacing:0;font-weight:400;color:var(--muted)}
.start{display:grid;gap:6px;padding:18px 4px}
.start b{font-family:var(--f-disp);font-size:20px}
.start span{color:var(--muted);font-size:14px}
.school .pf{display:block;font-size:11px;font-weight:400;color:var(--muted);line-height:1.3}
.sc-head h2 .pf{display:block;font-size:13px;font-weight:700;color:var(--muted);font-family:var(--f-body)}
.reset-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;height:42px;padding:0 16px;font-weight:700}
.reset-btn:hover{border-color:var(--muted)}
.day-chips{gap:6px}
.day-chips .chip small{font-size:11px;opacity:.7;margin-left:4px}
.btn[disabled]{opacity:.45}
.pm-launch-wrap{max-width:1280px;margin:0 auto;padding:12px 16px 0}
.pm-launch{width:100%;border:0;border-radius:14px;background:var(--ink);color:var(--surface);min-height:64px;display:flex;align-items:center;justify-content:center;gap:10px;font-size:18px;font-weight:700;flex-wrap:wrap;padding:8px 14px}
.pm-launch small{font-size:12px;font-weight:400;opacity:.75;flex-basis:100%;text-align:center;margin-top:-4px}
.pm{position:fixed;inset:0;z-index:35;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 10px) 16px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column;gap:12px}
body.pm-open{overflow:hidden}
.pm>*{width:100%;max-width:720px;margin-left:auto;margin-right:auto}
.pm-top{display:flex;align-items:center;gap:8px;min-height:44px}
.pm-mode{font-family:var(--f-disp);font-size:16px;margin-right:auto}
.pm-back{border:0;background:var(--chip);color:var(--chip-ink);border-radius:999px;height:44px;padding:0 16px;font-weight:700;font-size:16px}
.pm-exit{border:1px solid var(--line);background:var(--surface);border-radius:999px;height:40px;padding:0 14px;font-size:13px}
.pm-crumbs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.pm-crumb{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:6px 8px;text-align:left;display:grid;gap:1px;min-width:0}
.pm-crumb small{font-size:10px;color:var(--muted)}
.pm-crumb b{font-size:12px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pm-crumb.cur{border-color:var(--accent);background:var(--accent-soft)}
.pm-crumb[disabled]{opacity:.5}
.pm-q{font-size:24px;font-weight:900;line-height:1.3;margin-top:4px}
.pm-body{display:flex;flex-direction:column;gap:12px}
.pm-sub{margin:4px 0 0;font-size:13px;font-weight:700;color:var(--muted)}
.pm-note{margin:0;color:var(--muted)}
.pm-search{width:100%;height:54px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 16px;font-size:18px}
.pm-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pm-grid.one{grid-template-columns:1fr}.pm-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.pm-btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;min-height:64px;padding:10px 14px;font-size:19px;font-weight:700;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:2px;box-shadow:var(--shadow)}
.pm-btn small{font-size:12px;font-weight:400;color:var(--muted)}
.pm-btn:active{background:var(--accent-soft);border-color:var(--accent)}
.pm-btn.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.pm-btn.on small{color:var(--surface)}
.pm-school small{order:-1}
.pm-huge{min-height:96px;font-size:28px;flex-direction:row;align-items:center;justify-content:flex-start;gap:14px}
.pm-huge .gmark{width:16px;height:16px;border-radius:5px}
.pm-big{min-height:84px;font-size:24px;align-items:center;text-align:center}
.pm-size{flex-direction:row;align-items:center;justify-content:flex-start;gap:12px;font-size:20px}
.pm-size .sdot{width:28px;height:28px}
.pm-size small{display:block}
.pm-next{border:0;border-radius:14px;background:var(--accent);color:var(--accent-ink);min-height:60px;font-size:18px;font-weight:700}
.pm-next.sm{min-height:54px;padding:0 20px;white-space:nowrap;flex:none}
.pm-skip{border:0;background:transparent;color:var(--muted);text-decoration:underline;min-height:48px;font-size:15px}
.pm-free{display:flex;gap:8px}
.pm-sum{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 14px}
.pm-sum-row{display:grid;grid-template-columns:56px 1fr;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);align-items:baseline}
.pm-sum-row:last-child{border-bottom:0}
.pm-sum-row span{font-size:12px;color:var(--muted)}.pm-sum-row b{font-size:19px;line-height:1.35}.pm-sum-row b.thin{font-size:14px;font-weight:400}
.pm-fukusho{margin:0;font-size:19px;line-height:1.6;background:var(--accent-soft);border-radius:12px;padding:12px 14px;font-weight:700}
.pm-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);align-items:center}
.pm-index{position:sticky;top:-10px;z-index:2;display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;background:var(--bg);padding:8px 0}
.pm-index button[disabled]{opacity:.3}
.pm-index button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;height:44px;font-size:17px;font-weight:700;padding:0}
.pm-city{font-style:normal;display:inline-block;margin-left:6px;font-size:.78em;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:1px 7px;vertical-align:middle}
.pm-school{flex-direction:column;align-items:flex-start}
.pm-school .pm-city{margin-left:0;margin-top:3px}
/* 種別の色分け */

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--k-pre:#F2A266;--k-pre-s:#3A2A1C;--k-ele:#5CC489;--k-ele-s:#1B3326;--k-jhs:#7CA6F0;--k-jhs-s:#1D2A44;--k-hs:#B293E8;--k-hs-s:#2C2140;--k-sp:#9AA8BA;--k-sp-s:#262D38}}
:root[data-theme="dark"]{--k-pre:#F2A266;--k-pre-s:#3A2A1C;--k-ele:#5CC489;--k-ele-s:#1B3326;--k-jhs:#7CA6F0;--k-jhs-s:#1D2A44;--k-hs:#B293E8;--k-hs-s:#2C2140;--k-sp:#9AA8BA;--k-sp-s:#262D38}
.k-pre{--kc:var(--k-pre);--ks:var(--k-pre-s)}.k-ele{--kc:var(--k-ele);--ks:var(--k-ele-s)}.k-jhs{--kc:var(--k-jhs);--ks:var(--k-jhs-s)}.k-hs{--kc:var(--k-hs);--ks:var(--k-hs-s)}.k-sp{--kc:var(--k-sp);--ks:var(--k-sp-s)}
.kc-pre{--kc:var(--k-pre);--ks:var(--k-pre-s)}.kc-ele{--kc:var(--k-ele);--ks:var(--k-ele-s)}.kc-jhs{--kc:var(--k-jhs);--ks:var(--k-jhs-s)}.kc-hs{--kc:var(--k-hs);--ks:var(--k-hs-s)}.kc-sp{--kc:var(--k-sp);--ks:var(--k-sp-s)}
.school[class*="k-"]{border-left:6px solid var(--kc);background:var(--ks)}
.school[class*="k-"] .t{background:var(--kc);color:#fff}
.school[class*="k-"][aria-pressed="true"]{border-color:var(--accent);border-left-color:var(--kc);box-shadow:0 0 0 2px var(--accent) inset}
.grp.kh{font-size:14px;color:var(--kc);border-bottom:2px solid var(--kc);padding:10px 2px 3px;margin-top:4px}
.kdot{width:10px;height:10px;border-radius:50%;background:var(--kc);display:inline-block}
.chip[class*="kc-"][aria-pressed="true"]{background:var(--kc);border-color:var(--kc);color:#fff}
.chip[class*="kc-"][aria-pressed="true"] .kdot{background:#fff}
.pm-school[class*="k-"]{border-left:8px solid var(--kc);background:var(--ks)}
.pm-kh{font-size:18px;font-weight:900;color:var(--kc);border-bottom:3px solid var(--kc);padding-bottom:4px;margin:14px 0 6px;display:flex;justify-content:space-between;align-items:baseline}
.pm-kh small{font-size:12px;font-weight:400;color:var(--muted)}
.pm-sec{display:flex;flex-direction:column;gap:8px}
.pm-gyo{font-size:13px;font-weight:700;color:var(--muted);margin:6px 0 0}
.pm-kinds{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.pm-kinds button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;height:48px;font-size:15px;font-weight:700;padding:0;border-bottom:4px solid var(--kc,var(--line))}
.pm-kinds button.on{background:var(--kc,var(--ink));color:#fff;border-color:var(--kc,var(--ink))}
.pm-top-btn{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);z-index:36;border:0;border-radius:999px;background:var(--ink);color:var(--surface);height:56px;padding:0 18px 0 14px;display:flex;align-items:center;gap:6px;font-weight:900;font-size:16px;box-shadow:0 6px 18px rgba(10,15,25,.3)}
.gyo-index{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);padding:6px 0;box-shadow:0 6px 8px -6px rgba(10,15,25,.25)}

.gyo-index button[disabled]{opacity:.3}

<body>
<header class="top">
  <div class="brand"><h1><span>さくらや </span>問い合わせ手帳</h1><span>電話を受けながら、タップで聞き取り</span></div>
  <button class="reset-btn" id="resetAll">最初から</button>
  <button class="memo-btn" id="openMemo">通話メモ <span class="cnt num" id="memoCount">0</span></button>
</header>

<div class="pm-launch-wrap"><button class="pm-launch" id="openPM"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25 11.4 11.4 0 0 0 3.6.57 1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.25.2 2.45.57 3.6a1 1 0 0 1-.25 1Z"/></svg>電話モードで聞き取る<small>1画面ずつ大きなボタンで</small></button></div>
<main class="app">
  <section class="panel picker" id="picker">
    <div class="picker-head">
      <span class="label">1　学校をえらぶ</span>
      <span class="cur" id="curSchool"></span>
      <button class="toggle-list" id="toggleList">変更</button>
    </div>
    <div class="picker-body">
      <input class="search" id="q" type="search" placeholder="学校名・よみで検索（例：じょうけん、さかいで）" autocomplete="off">
      <div class="chips kind-chips" id="kindChips"></div>
      <div class="gyo-index" id="gyoIndex"></div>
      <div class="school-list" id="schoolList"></div>
      <span class="count-note" id="countNote"></span>
    </div>
  </section>

  <section class="detail">
    <div class="panel school-card" id="schoolCard"></div>
    <div class="panel filters" id="filters"></div>
    <div class="panel inq" id="inquiry"></div>
  </section>
</main>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" hidden aria-label="通話メモ">
  <div class="sheet-head"><h2>通話メモ</h2><button class="x" id="closeMemo" aria-label="閉じる">×</button></div>
  <div class="field"><span class="label">問い合わせ内容（自動）</span><textarea id="memoSummary" rows="3"></textarea></div>
  <div class="two">
    <div class="field"><label class="label" for="memoName">お名前</label><input id="memoName" autocomplete="off"></div>
    <div class="field"><label class="label" for="memoTel">電話番号</label><input id="memoTel" inputmode="tel" autocomplete="off"></div>
  </div>
  <div class="two">
    <div class="field"><label class="label" for="memoKind">用件</label>
      <select id="memoKind"><option>在庫確認</option><option>取り置き</option><option>入荷連絡の希望</option><option>買取の相談</option><option>その他</option></select></div>
    <div class="field"><span class="label">折り返し</span><label class="switch"><input type="checkbox" id="memoCb"> 折り返しが必要</label></div>
  </div>
  <div class="field"><label class="label" for="memoNote">メモ</label><textarea id="memoNote" placeholder="例：3月中に来店予定。身長158cm"></textarea></div>
  <div class="btnrow"><button class="btn primary" id="saveMemo">メモを保存</button><button class="btn" id="saveReset">保存して最初から</button></div>
  <div class="memo-head"><span class="label">保存したメモ（日付ごと・この端末のみ）</span></div>
  <div class="chips day-chips" id="memoDays"></div>
  <div class="btnrow"><button class="btn" id="copyDay">この日をコピー</button><button class="btn" id="copyMemo">全件コピー</button></div>
  <div class="logs" id="logs"></div>
</aside>
<div class="pm" id="pm" hidden aria-label="電話モード"></div>
<button class="pm-top-btn" id="pmTop" hidden aria-label="一番上に戻る"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 5.5 5.3 12.2a1 1 0 1 0 1.4 1.4L11 9.3V19a1 1 0 1 0 2 0V9.3l4.3 4.3a1 1 0 0 0 1.4-1.4Z"/></svg>TOP</button>
<div class="toast" id="toast" hidden></div>

function chartKey(s,item){

  if(s.kind==='中学校') return c==='gym'?'hs':'jhs';

}

/* 通常画面：あかさたなで一覧の該当行へ飛ぶ（今見ている種別の中を優先） */
function jumpGyo(g){
  const list=$('schoolList'); const inner=list.scrollHeight>list.clientHeight+4;
  const ref=(inner?list.getBoundingClientRect().top:0)+(inner?40:80);
  const heads=[...list.querySelectorAll('[data-ksec]')]; if(!heads.length) return;
  let cur=0; heads.forEach((h,i)=>{ if(h.getBoundingClientRect().top<=ref) cur=i; });
  const marks=[...list.querySelectorAll('[data-gyo]')];
  const inSec=i=>m=>{ const a=heads[i], b=heads[i+1]; return (a.compareDocumentPosition(m)&4)&&(!b||(m.compareDocumentPosition(b)&4)); };
  let el=null; for(const i of [cur,...heads.map((_,i)=>i).filter(i=>i!==cur)]){ el=marks.find(m=>m.dataset.gyo===g&&inSec(i)(m)); if(el) break; }
  if(!el) return;
  if(inner){ list.scrollTo({top:list.scrollTop+el.getBoundingClientRect().top-list.getBoundingClientRect().top-4,behavior:'smooth'}); }
  else { window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-64,behavior:'smooth'}); }
}

const WD='日月火水木金土';
const pad=n=>String(n).padStart(2,'0');
function memoTs(m){
  if(m.ts) return m.ts;
  const mm=/(\d+)\/(\d+)\s+(\d+):(\d+)/.exec(m.at||''); const now=new Date();
  if(!mm) return Date.now();
  let y=now.getFullYear(); if(+mm[1]>now.getMonth()+1) y--;
  return new Date(y,+mm[1]-1,+mm[2],+mm[3],+mm[4]).getTime();
}
memos.forEach(m=>{if(!m.ts)m.ts=memoTs(m);});
const dayKey=ts=>{const d=new Date(ts);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const dayLabel=k=>{const [y,mo,da]=k.split('-').map(Number);const d=new Date(y,mo-1,da);return `${mo}/${da}（${WD[d.getDay()]}）`;};

function memoText(m){const d=new Date(m.ts);return `${pad(d.getHours())}:${pad(d.getMinutes())}　${m.kind}${m.cb?'【折り返し】':''}\n${m.summary}\n${m.name||'（名前なし）'} ${m.tel||''}${m.note?'\n'+m.note:''}`}
function renderLogs(){
  const tk=todayKey();
  $('memoCount').textContent=memos.filter(m=>dayKey(m.ts)===tk).length;
  const days=[...new Set(memos.map(m=>dayKey(m.ts)))].sort().reverse();
  if(!days.includes(tk)) days.unshift(tk);
  if(!days.includes(memoDay)) memoDay=tk;
  $('memoDays').innerHTML=days.map(k=>{const n=memos.filter(m=>dayKey(m.ts)===k).length;
    return `<button class="chip sm" data-day="${k}" aria-pressed="${k===memoDay}">${k===tk?'今日 ':''}${dayLabel(k)}<small class="num">${n}件</small></button>`;}).join('');
  const list=memos.map((m,i)=>({m,i})).filter(x=>dayKey(x.m.ts)===memoDay).sort((a,b)=>b.m.ts-a.m.ts);
  $('logs').innerHTML=list.length?list.map(({m,i})=>{const d=new Date(m.ts);return `<div class="log"><div class="lh"><b>${esc(m.name||'名前なし')}</b><span class="num">${esc(m.tel||'')}</span>${m.cb?'<span class="cb">折り返し</span>':''}<button class="del" data-del="${i}">削除</button></div>

  if(d.pgo){ if(d.pgo==='school'){PM.city=null;PM.q='';} pmGo(d.pgo==='item'&&PM.step==='confirm'?'item':d.pgo); return; }
  if(d.pkind){PM.kind=d.pkind;pmSchoolResults();$('pm').scrollTop=0;return;}
  if(d.pgyo){ const pm=$('pm'); const secs=[...pm.querySelectorAll('.pm-sec')]; if(!secs.length) return;
    // 今見ている種別（画面上部にある区切り）の中で、その行に飛ぶ
    let cur=secs[0]; secs.forEach(x=>{ if(x.offsetTop<=pm.scrollTop+160) cur=x; });
    const order=[cur,...secs.filter(x=>x!==cur)];
    let el=null; for(const sec of order){ el=sec.querySelector(`[data-gyo="${d.pgyo}"]`); if(el) break; }
    if(el) pm.scrollTo({top:el.offsetTop-120,behavior:'smooth'}); return; }
  if(d.pschool){ selectSchool(d.pschool); pushRecent(d.pschool); PM.q=''; PM.city=null; pmGo('gender'); return; }
  if(d.pgender){ S.gender=d.pgender; const it=curItem(); if(!it||!gOk(it,S.gender)){S.item='';} pmGo('item'); return; }
  if(d.pitem){ S.item=d.pitem; resetVars(); S.sizes.clear(); S.sizeFree=''; pmNext(); return; }
  if(d.pseason){ if(S.season!==d.pseason){S.season=d.pseason;S.gparts.clear();} renderPM(); return; }
  if(d.pgpart){ S.gparts.has(d.pgpart)?S.gparts.delete(d.pgpart):S.gparts.add(d.pgpart); renderPM(); return; }
  if(d.pvar){ S.vars.has(d.pvar)?S.vars.delete(d.pvar):S.vars.add(d.pvar); renderPM(); return; }
  if(d.pvar1){ S.vars.clear(); S.vars.add(d.pvar1); pmGo('size'); return; }
  if(d.psize){ S.sizes.clear(); S.sizes.add(d.psize); pmGo('confirm'); return; }
  if(d.pfree){ S.sizeFree=$('pmFree').value; S.sizes.clear(); pmGo('confirm'); return; }
  if(d.pnext){ pmNext(); return; }
  if(d.pmemo){ openMemo(); return; }
  if(d.pmore){ S.item=''; resetVars(); S.sizes.clear(); S.sizeFree=''; pmGo('item'); return; }
  if(d.pnew){ resetAll(); PM.step='school'; PM.city=null; PM.q=''; renderPM(); $('pm').scrollTop=0; return; }
});
$('openPM').onclick=openPM;
function pmTopUpdate(){ $('pmTop').hidden=$('pm').hidden||$('pm').scrollTop<300; }
$('pm').addEventListener('scroll',pmTopUpdate,{passive:true});
$('pmTop').onclick=()=>{ $('pm').scrollTo({top:0,behavior:'smooth'}); };


renderLogs(); render();
</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script>
